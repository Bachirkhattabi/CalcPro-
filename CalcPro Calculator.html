<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CalcPro</title>
<style>
:root{color-scheme:dark;--bg:#080a0f;--panel:#11151d;--panel2:#171c26;--key:#1c222d;--key2:#242b38;--text:#f4f7fb;--muted:#8e98a8;--accent:#72e6b2;--accent2:#43c9ff;--danger:#ff7185;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100vh}.app{min-height:100vh;background:radial-gradient(circle at 50% -10%,rgba(67,201,255,.11),transparent 34%),radial-gradient(circle at 90% 90%,rgba(114,230,178,.07),transparent 28%),var(--bg);display:grid;place-items:center;padding:28px 16px}
.shell{width:min(980px,100%);display:grid;grid-template-columns:minmax(0,600px) minmax(220px,1fr);gap:18px}.card{background:linear-gradient(145deg,rgba(23,28,38,.97),rgba(12,15,21,.98));border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.035);border-radius:28px;overflow:hidden}.calc{padding:22px}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand h1{font-size:18px;letter-spacing:.08em;margin:0;font-weight:750}.brand span{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}.display{min-height:154px;border-radius:21px;background:rgba(4,7,11,.62);border:1px solid var(--line);padding:20px 20px 18px;display:flex;flex-direction:column;justify-content:flex-end;text-align:right;overflow:hidden}.expression{min-height:31px;color:var(--muted);font-size:22px;white-space:nowrap;overflow:auto;scrollbar-width:none}.expression::-webkit-scrollbar{display:none}.result{font-size:clamp(42px,7vw,62px);font-weight:650;line-height:1.08;letter-spacing:-.04em;white-space:nowrap;overflow:auto;scrollbar-width:none}.result::-webkit-scrollbar{display:none}.error{color:var(--danger)!important;font-size:27px!important;letter-spacing:-.02em}.keys{margin-top:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.key{border:0;border-radius:17px;min-height:66px;background:linear-gradient(145deg,var(--key2),var(--key));color:var(--text);font-size:21px;font-weight:650;cursor:pointer;box-shadow:inset 0 1px rgba(255,255,255,.045),0 7px 14px rgba(0,0,0,.18);transition:transform .09s ease,filter .15s ease,background .15s ease}.key:hover{filter:brightness(1.12)}.key:active{transform:scale(.96);filter:brightness(.92)}.op{color:var(--accent);background:linear-gradient(145deg,#21352f,#18251f)}.utility{color:#cbd3df;background:#202631}.equals{color:#06110d;background:linear-gradient(145deg,var(--accent),#49d6a0);font-size:25px}.wide{grid-column:span 2}.history{padding:22px;display:flex;flex-direction:column;min-height:100%}.history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.history h2{font-size:15px;margin:0;letter-spacing:.04em}.clear-history{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:7px 10px;font-size:11px;cursor:pointer}.clear-history:hover{color:var(--text);border-color:rgba(255,255,255,.18)}.history-list{overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px;max-height:520px}.empty{color:var(--muted);font-size:13px;text-align:center;padding:35px 10px}.item{padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025);cursor:pointer}.item:hover{background:rgba(255,255,255,.05)}.item-expression{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-result{font-size:18px;font-weight:650;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hint{margin-top:auto;padding-top:18px;color:var(--muted);font-size:11px;line-height:1.5}.kbd{display:inline-block;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:1px 5px;border-radius:5px;color:#cbd3df}
@media(max-width:820px){.shell{grid-template-columns:1fr;max-width:620px}.history{min-height:0}.history-list{max-height:260px}.hint{display:none}}
@media(max-width:460px){.app{padding:10px}.card{border-radius:21px}.calc{padding:14px}.display{min-height:135px;padding:16px}.expression{font-size:18px}.result{font-size:42px}.keys{gap:7px;margin-top:10px}.key{min-height:58px;border-radius:14px;font-size:19px}.history{padding:16px}}
</style>
</head>
<body>
<main class="app"><div class="shell">
<section class="card calc" aria-label="CalcPro calculator">
<div class="brand"><h1>CalcPro</h1><span>Precision calculator</span></div>
<div class="display" aria-live="polite"><div id="expression" class="expression"></div><div id="result" class="result">0</div></div>
<div class="keys" id="keys">
<button class="key utility" data-action="clear">AC</button><button class="key utility" data-value="(">(</button><button class="key utility" data-value=")">)</button><button class="key utility" data-action="backspace">⌫</button>
<button class="key" data-value="7">7</button><button class="key" data-value="8">8</button><button class="key" data-value="9">9</button><button class="key op" data-value="÷">÷</button>
<button class="key" data-value="4">4</button><button class="key" data-value="5">5</button><button class="key" data-value="6">6</button><button class="key op" data-value="×">×</button>
<button class="key" data-value="1">1</button><button class="key" data-value="2">2</button><button class="key" data-value="3">3</button><button class="key op" data-value="-">−</button>
<button class="key utility" data-action="sign">+/−</button><button class="key" data-value="0">0</button><button class="key" data-value=".">.</button><button class="key op" data-value="+">+</button>
<button class="key utility" data-value="%">%</button><button class="key equals wide" data-action="equals">=</button>
</div></section>
<aside class="card history"><div class="history-head"><h2>Calculation history</h2><button class="clear-history" id="clearHistory">Clear History</button></div><div id="historyList" class="history-list"></div><div class="hint">Keyboard: <span class="kbd">Enter</span> equals · <span class="kbd">Esc</span> clear · <span class="kbd">Backspace</span> delete</div></aside>
</div></main>
<script>
(() => {
const expressionEl=document.getElementById('expression'),resultEl=document.getElementById('result'),keys=document.getElementById('keys'),historyList=document.getElementById('historyList'),clearHistoryBtn=document.getElementById('clearHistory');
let expression=''; let justEvaluated=false; let error=false;
const HISTORY_KEY='calcpro-history-v1';
function normalize(s){return s.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-');}
function tokenize(s){const out=[];let i=0;while(i<s.length){const c=s[i];if(/\s/.test(c)){i++;continue}if(/[0-9.]/.test(c)){let n='',dots=0;while(i<s.length&&/[0-9.]/.test(s[i])){if(s[i]==='.')dots++;n+=s[i++]}if(!n||dots>1||n==='.')throw Error('Invalid calculation');out.push({t:'num',v:Number(n)});continue}if('+-*/()%'.includes(c)){out.push({t:'op',v:c});i++;continue}throw Error('Invalid calculation')}return out;}
function parse(s){const t=tokenize(normalize(s));let p=0;function primary(){if(!t[p])throw Error('Invalid calculation');if(t[p].t==='num')return t[p++].v;if(t[p].v==='('){p++;const v=add();if(!t[p]||t[p].v!==')')throw Error('Invalid calculation');p++;return v}if(t[p].v==='-'){p++;return -primary()}if(t[p].v==='+'){p++;return primary()}throw Error('Invalid calculation')}
function percent(v){return v/100}
function unary(){let v=primary();while(t[p]&&t[p].v==='%'){p++;v=percent(v)}return v}
function mul(){let v=unary();while(t[p]&&('*//'.includes(t[p].v))){const op=t[p++].v,b=unary();if(op==='/'&&b===0)throw Error('Division by zero');v=op==='*'?v*b:v/b}return v}
function add(){let v=mul();while(t[p]&&'+-'.includes(t[p].v)){const op=t[p++].v,b=mul();v=op==='+'?v+b:v-b}return v}
const v=add();if(p!==t.length)throw Error('Invalid calculation');if(!Number.isFinite(v))throw Error('Invalid calculation');return v;}
function format(n){if(Object.is(n,-0))n=0;return Number(n.toPrecision(14)).toString();}
function setError(msg){error=true;expressionEl.textContent=expression;resultEl.textContent=msg;resultEl.classList.add('error');}
function update(){expressionEl.textContent=expression;resultEl.classList.remove('error');if(!expression){resultEl.textContent='0';return}try{resultEl.textContent=format(parse(expression))}catch(e){resultEl.textContent='';}}
function append(v){if(error){expression='';error=false;resultEl.classList.remove('error')}if(justEvaluated&&!['+','-','×','÷','%'].includes(v))expression='';justEvaluated=false;
const last=expression.slice(-1);if(/[+\-×÷]/.test(v)&&/[+\-×÷]$/.test(expression)){if(v==='-'&&last!=='-')expression+=v;else expression=expression.slice(0,-1)+v;update();return}
if(v==='.') {const segment=expression.split(/[+\-×÷()]/).pop();if(segment.includes('.'))return;if(!segment)expression+='0'}
if(v==='('&&last&&(/[0-9.)%]/.test(last)))return;if(v===')'){const opens=(expression.match(/\(/g)||[]).length,closes=(expression.match(/\)/g)||[]).length;if(!opens||opens<=closes||/[+\-×÷(]$/.test(expression))return}
if(v==='%'&&!/[0-9)]$/.test(expression))return;expression+=v;update();}
function clear(){expression='';justEvaluated=false;error=false;resultEl.classList.remove('error');update();}
function backspace(){if(error){clear();return}expression=expression.slice(0,-1);justEvaluated=false;update();}
function sign(){if(error)return; if(!expression)return; const m=expression.match(/(\d+(?:\.\d+)?|\([^()]*\))$/);if(!m)return;const start=expression.length-m[0].length;expression=expression.slice(0,start)+(m[0][0]==='-'?m[0].slice(1):'-'+m[0]);update();}
function getHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch{return[]}}
function saveHistory(expr,res){const h=getHistory();h.unshift({expr,res});localStorage.setItem(HISTORY_KEY,JSON.stringify(h.slice(0,30)));renderHistory();}
function renderHistory(){const h=getHistory();historyList.innerHTML='';if(!h.length){historyList.innerHTML='<div class="empty">Your completed calculations will appear here.</div>';return}h.forEach(item=>{const el=document.createElement('div');el.className='item';el.innerHTML='<div class="item-expression"></div><div class="item-result"></div>';el.children[0].textContent=item.expr;el.children[1].textContent='= '+item.res;el.addEventListener('click',()=>{expression=item.expr;justEvaluated=false;error=false;update()});historyList.appendChild(el)});}
function equals(){if(!expression)return;try{const value=format(parse(expression));saveHistory(expression,value);expressionEl.textContent=expression;resultEl.textContent=value;resultEl.classList.remove('error');justEvaluated=true}catch(e){setError(e.message==='Division by zero'?'Cannot divide by zero':'Invalid calculation');justEvaluated=false}}
keys.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action,v=b.dataset.value;if(a==='clear')clear();else if(a==='backspace')backspace();else if(a==='sign')sign();else if(a==='equals')equals();else append(v)});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;if(/^[0-9]$/.test(k)){append(k);e.preventDefault()}else if(['+','-','*','/','%','(',')','.'].includes(k)){append(k==='*'?'×':k==='/'?'÷':k);e.preventDefault()}else if(k==='Enter'||k==='='){equals();e.preventDefault()}else if(k==='Backspace'){backspace();e.preventDefault()}else if(k==='Escape'){clear();e.preventDefault()}});
clearHistoryBtn.addEventListener('click',()=>{localStorage.removeItem(HISTORY_KEY);renderHistory()});renderHistory();update();
})();
</script></body></html>
